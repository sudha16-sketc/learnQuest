version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learnquest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnquest"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: learnquest-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/learnquest?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgrespassword@postgres:5432/learnquest?schema=public
      JWT_SECRET: learnquest_docker_secret_jwt_key
      CORS_ORIGIN: "*"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_CACHE_TTL_MS: ${AI_CACHE_TTL_MS:-600000}
      AI_CACHE_MAX_ENTRIES: ${AI_CACHE_MAX_ENTRIES:-200}
      MST_CHAIN_ID: 91562037
      MST_RPC_URL: https://testnetrpc.mstblockchain.com
      MST_EXPLORER_URL: https://testnet.mstscan.com
      REWARD_SIGNER_PRIVATE_KEY: ${REWARD_SIGNER_PRIVATE_KEY:?Set REWARD_SIGNER_PRIVATE_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
